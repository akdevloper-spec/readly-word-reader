<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Free offline-friendly Word reader with Android text-to-speech voices.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Readly — Free Word Reader</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090d1a;
  --panel:#12192c;
  --panel2:#1a243f;
  --reader-bg:#0c1324;
  --line:#273352;
  --text:#eef2ff;
  --muted:#9aa7c7;
  --accent:#8ea0ff;
  --line-hl-bg:rgba(124, 144, 255, 0.25);
  --line-hl-border:rgba(155, 173, 255, 0.55);
  --word-hl-bg:rgba(155, 173, 255, 0.44);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top,#182342 0,var(--bg) 60%);
  color:var(--text);
  font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
header{
  max-width:1160px;
  margin:auto;
  padding:16px 18px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#9caeff,#6d5ce0);
  display:grid;place-items:center;
  font-size:20px;color:#0e1528;font-weight:900;
  box-shadow:0 6px 18px rgba(109,92,224,.35);
}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
header p{margin:1px 0 0;color:var(--muted);font-size:12.5px}

main{
  max-width:1160px;
  margin:auto;
  padding:10px 18px 36px;
  display:grid;
  gap:14px;
}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 10px;
  flex-wrap:wrap;
}
.panel h2{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#c5d0ee;
  margin:0;
}
.setup-grid{display:grid;gap:14px}
.setup-grid.collapsed{display:none}

.upload{
  border:1.5px dashed #4f5f87;
  border-radius:12px;
  padding:12px;
  text-align:center;
  background:#0e1629;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.upload-info{text-align:left}
.upload-info strong{display:block;font-size:14px}
.upload-info p{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.upload-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

button,.button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  padding:8px 12px;
  border-radius:10px;
  font:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:background .15s,border-color .15s,transform .06s;
}
button:hover:not(:disabled),.button:hover{border-color:#5b6fa3;background:#222f52}
button:active:not(:disabled),.button:active{transform:translateY(1px)}
button.primary,.button.primary{background:var(--accent);color:#0d1326;border-color:transparent}
button.primary:hover:not(:disabled),.button.primary:hover{background:#aebcff}
button:disabled{opacity:.4;cursor:not-allowed}

/* Native file input sits directly over the button so taps always open the picker */
.file-btn-wrap{
  position:relative;
  overflow:hidden;
  cursor:pointer;
}
.file-btn-wrap input[type=file]{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
  font-size:100px;
}

.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.field select{
  width:100%;
  background:#0c1324;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px 9px;
  font:inherit;
  font-size:13px;
}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input{flex:1;accent-color:var(--accent)}
.range-row output{min-width:38px;text-align:right;color:#c2caff;font-size:13px;font-variant-numeric:tabular-nums}

.player{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.player button{min-width:64px}
.progress{height:6px;background:#222d47;border-radius:99px;margin:14px 0 7px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c90ff,#c4a8ff);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:10px}
.status{color:var(--muted);font-size:12.5px;margin-top:8px}

/* Reader Panel & Expanded Reading Window */
.reader-panel{display:flex;flex-direction:column;padding:14px}
.reader-toolbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding-bottom:10px;
  margin-bottom:10px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.mini-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini-controls button{padding:6px 10px;font-size:12.5px}
.reader-badge{
  font-size:12px;
  color:#c2caff;
  background:#19233e;
  border:1px solid var(--line);
  padding:5px 10px;
  border-radius:99px;
}

.reader{
  height:82vh;
  min-height:540px;
  overflow-y:auto;
  overflow-x:hidden;
  line-height:2.0;
  font-size:18px;
  letter-spacing:.005em;
  background:var(--reader-bg);
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px 26px;
  scroll-behavior:smooth;
}
.reader .paragraph{
  display:block;
  margin-bottom:18px;
  color:#dfe6fb;
}
.reader .word{
  cursor:pointer;
  border-radius:4px;
  padding:2px 0;
  transition:background-color .06s ease, color .06s ease;
}
.reader .word:hover{background:rgba(142,160,255,.16)}

/* Highlights ONLY the single visual line currently being spoken */
.reader .word.line-active{
  background:var(--line-hl-bg);
  color:#ffffff;
  box-shadow:0 2px 0 var(--line-hl-border);
}
/* Subtle emphasis on the active word within that line */
.reader .word.word-active{
  background:var(--word-hl-bg);
  color:#ffffff;
  font-weight:600;
}
/* Selected starting line when paused/stopped */
.reader .word.line-selected{
  background:rgba(99, 122, 184, 0.25);
  color:#ffffff;
  box-shadow:0 2px 0 rgba(130, 155, 224, 0.5);
}

/* Full-Viewport Focus Mode */
body.focus-mode{overflow:hidden}
body.focus-mode .reader-panel{
  position:fixed;
  inset:0;
  z-index:999;
  border-radius:0;
  border:none;
  padding:12px 16px;
  background:var(--bg);
}
body.focus-mode .reader-toolbar{background:var(--bg)}
body.focus-mode .reader{
  height:calc(100vh - 68px);
  min-height:0;
  max-width:960px;
  width:100%;
  margin:0 auto;
}

@media(min-width:820px){
  .setup-two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .reader{height:84vh;padding:28px 34px;font-size:18.5px}
}
@media(max-width:480px){
  header{padding:12px 14px 6px}
  main{padding:8px 12px 24px}
  .panel{padding:11px}
  .reader{height:80vh;min-height:480px;padding:16px 15px;font-size:16.5px;line-height:1.9}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">▶</div>
    <div>
      <h1>Readly</h1>
      <p>Free offline
